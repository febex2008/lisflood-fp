name: Apply GIS Flood solver fixes

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-gis-flood-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply exact solver fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              data = p.read_bytes()
              count = data.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}")
              p.write_bytes(data.replace(old, new))

          replace_exact(
              "lisflood/swe/fv1.cpp",
              b"NUMERIC_TYPE H_new = FMIN(C(0.0), BCptr->PS_Val[ps_i] - Z);",
              b"NUMERIC_TYPE H_new = FMAX(C(0.0), BCptr->PS_Val[ps_i] - Z);",
          )

          replace_exact(
              "lisflood/swe/fv1.cpp",
              b"case FREE1:\r\n\t\tH_outside = H_inside;\r\n\t\tHU_outside = HU_inside;\r\n\t\tHV_outside = HV_outside;",
              b"case FREE1:\r\n\t\tH_outside = H_inside;\r\n\t\tHU_outside = HU_inside;\r\n\t\tHV_outside = HV_inside;",
          )

          replace_exact(
              "lisflood/cuda/cuda_boundary.cu",
              b"NUMERIC_TYPE H_new = FMIN(C(0.0),",
              b"NUMERIC_TYPE H_new = FMAX(C(0.0),",
          )

      - name: Verify only intended files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'lisflood/cuda/cuda_boundary.cu\nlisflood/swe/fv1.cpp' || {
            echo "Unexpected changed files" >&2
            exit 1
          }
          git diff -- lisflood/swe/fv1.cpp lisflood/cuda/cuda_boundary.cu

      - name: Commit solver fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lisflood/swe/fv1.cpp lisflood/cuda/cuda_boundary.cu
          git commit -m "Fix FV1 free-boundary momentum and point-stage clamping" \
            -m "Fix CPU FV1 FREE1 tangential momentum copying and correct point HFIX stage-depth clamping from FMIN to FMAX. Apply the equivalent CUDA point HFIX/HVAR clamping correction so CPU and CUDA use non-negative prescribed depths consistently."
          git push origin HEAD:dev
