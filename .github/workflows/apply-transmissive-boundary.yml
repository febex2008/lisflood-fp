name: Apply transmissive boundary patch

on:
  push:
    branches: [transmissive-impl]
    paths:
      - '.github/workflows/apply-transmissive-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transmissive-impl
          fetch-depth: 0

      - name: Apply guarded byte-preserving patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              p=Path(path); b=p.read_bytes(); nl=b'\r\n' if b'\r\n' in b else b'\n'; return p,b,nl
          def replace_once(path, old, new):
              p,b,nl=read(path)
              old=old(nl) if callable(old) else old
              new=new(nl) if callable(new) else new
              n=b.count(old)
              if n!=1:
                  raise SystemExit(f'{path}: expected exactly one match, found {n}')
              p.write_bytes(b.replace(old,new,1))

          # New custom source type; keep all existing numeric values unchanged.
          replace_once('lisflood/lisflood.h',
              lambda nl: b'\tRATE8 = 8,'+nl,
              lambda nl: b'\tRATE8 = 8,'+nl+b'\t// GIS-Flood custom flux-transmissive outer boundary'+nl+b'\tTRANSMISSIVE9 = 9,'+nl)

          # CPU FV1: FREE fallback semantics for degenerate one-cell-wide domains.
          replace_once('lisflood/swe/fv1.cpp',
              lambda nl: b'\tcase FREE1:'+nl+b'\t\tH_outside = H_inside;',
              lambda nl: b'\tcase FREE1:'+nl+b'\tcase TRANSMISSIVE9:'+nl+b'\t\tH_outside = H_inside;')

          # CPU FV1: carry the full nearest interior HLL flux vector through each outer face.
          p,b,nl=read('lisflood/swe/fv1.cpp')
          s=b.decode('utf-8')
          NL=nl.decode()
          def inject_segment(text, start, end, needle, payload):
              a=text.index(start); z=text.index(end,a)
              seg=text[a:z]
              pos=seg.index(needle)+len(needle)
              seg=seg[:pos]+payload+seg[pos:]
              return text[:a]+seg+text[z:]

          s=inject_segment(s, '\t// west'+NL, '\t// east'+NL,
              '\t\tNUMERIC_TYPE& FHVx = Arrptr->FHVx[j*(Parptr->xsz+1) + i];'+NL,
              NL+'\t\tconst int bc_i = boundary_index_w(Parptr, i, j);'+NL+
              '\t\tif (BCptr->BC_Ident[bc_i] == TRANSMISSIVE9 && Parptr->xsz > 1)'+NL+
              '\t\t{'+NL+
              '\t\t\tFHx = Arrptr->FHx[j*(Parptr->xsz+1) + 1];'+NL+
              '\t\t\tFHUx = Arrptr->FHUx[j*(Parptr->xsz+1) + 1];'+NL+
              '\t\t\tFHVx = Arrptr->FHVx[j*(Parptr->xsz+1) + 1];'+NL+
              '\t\t\tcontinue;'+NL+
              '\t\t}'+NL)

          s=inject_segment(s, '\t// east'+NL, '\t// north'+NL,
              '\t\tNUMERIC_TYPE& FHVx = Arrptr->FHVx[j*(Parptr->xsz+1) + i];'+NL,
              NL+'\t\tconst int bc_i = boundary_index_e(Parptr, i, j);'+NL+
              '\t\tif (BCptr->BC_Ident[bc_i] == TRANSMISSIVE9 && Parptr->xsz > 1)'+NL+
              '\t\t{'+NL+
              '\t\t\tFHx = Arrptr->FHx[j*(Parptr->xsz+1) + i-1];'+NL+
              '\t\t\tFHUx = Arrptr->FHUx[j*(Parptr->xsz+1) + i-1];'+NL+
              '\t\t\tFHVx = Arrptr->FHVx[j*(Parptr->xsz+1) + i-1];'+NL+
              '\t\t\tcontinue;'+NL+
              '\t\t}'+NL)

          s=inject_segment(s, '\t// north'+NL, '\t// south'+NL,
              '\t\tNUMERIC_TYPE& FHVy = Arrptr->FHVy[j*(Parptr->xsz+1) + i];'+NL,
              NL+'\t\tconst int bc_i = boundary_index_n(Parptr, i, j);'+NL+
              '\t\tif (BCptr->BC_Ident[bc_i] == TRANSMISSIVE9 && Parptr->ysz > 1)'+NL+
              '\t\t{'+NL+
              '\t\t\tFHy = Arrptr->FHy[(j+1)*(Parptr->xsz+1) + i];'+NL+
              '\t\t\tFHUy = Arrptr->FHUy[(j+1)*(Parptr->xsz+1) + i];'+NL+
              '\t\t\tFHVy = Arrptr->FHVy[(j+1)*(Parptr->xsz+1) + i];'+NL+
              '\t\t\tcontinue;'+NL+
              '\t\t}'+NL)

          s=inject_segment(s, '\t// south'+NL, NL+'void fv1::update_flow_variables',
              '\t\tNUMERIC_TYPE& FHVy = Arrptr->FHVy[j*(Parptr->xsz+1) + i];'+NL,
              NL+'\t\tconst int bc_i = boundary_index_s(Parptr, i, j);'+NL+
              '\t\tif (BCptr->BC_Ident[bc_i] == TRANSMISSIVE9 && Parptr->ysz > 1)'+NL+
              '\t\t{'+NL+
              '\t\t\tFHy = Arrptr->FHy[(j-1)*(Parptr->xsz+1) + i];'+NL+
              '\t\t\tFHUy = Arrptr->FHUy[(j-1)*(Parptr->xsz+1) + i];'+NL+
              '\t\t\tFHVy = Arrptr->FHVy[(j-1)*(Parptr->xsz+1) + i];'+NL+
              '\t\t\tcontinue;'+NL+
              '\t\t}'+NL)
          p.write_bytes(s.encode('utf-8'))

          # CUDA ghost state: TRANSMISSIVE uses FREE-like copied state only for ghost/CFL support;
          # the actual boundary flux is replaced below by the nearest resolved interior face flux.
          replace_once('lisflood/cuda/cuda_boundary.cu',
              lambda nl: b'\tcase FREE1:'+nl+b'\t\tbreak;',
              lambda nl: b'\tcase FREE1:'+nl+b'\tcase TRANSMISSIVE9:'+nl+b'\t\tbreak;')
          replace_once('lisflood/cuda/cuda_boundary.cu',
              lambda nl: b'\tcase FREE1:'+nl+b'\t\treturn U_inside;',
              lambda nl: b'\tcase FREE1:'+nl+b'\tcase TRANSMISSIVE9:'+nl+b'\t\treturn U_inside;')

          # CUDA FV1: substitute boundary face fluxes in shared memory after all HLL faces
          # have been resolved, then use the corrected shared flux for both update and stats.
          p,b,nl=read('lisflood/cuda/fv1/cuda_fv1_solver.cu')
          s=b.decode('utf-8'); NL=nl.decode()

          xa=s.index('__global__ void'+NL+'__launch_bounds__(CUDA_BLOCK_SIZE)'+NL+'update_flow_variables_x')
          xz=s.index('__global__ void'+NL+'__launch_bounds__(CUDA_BLOCK_SIZE)'+NL+'update_flow_variables_y',xa)
          x=s[xa:xz]
          old='\t\t\t\tF[threadIdx.y][threadIdx.x] = F_e;'+NL+'\t\t\t\tupdate_mass_stats_x(mass_stats, F_e.H, i, j);'+NL
          if x.count(old)!=1: raise SystemExit('CUDA x: expected one pre-sync mass-stats site')
          x=x.replace(old,'\t\t\t\tF[threadIdx.y][threadIdx.x] = F_e;'+NL,1)
          marker='\t\t\t__syncthreads();'+NL+NL+'\t\t\tif (threadIdx.x == 0) continue;'+NL
          if x.count(marker)!=1: raise SystemExit('CUDA x: sync marker mismatch')
          ins='\t\t\t__syncthreads();'+NL+NL+
              '\t\t\tif (i <= cuda::geometry.xsz && j <= cuda::geometry.ysz)'+NL+
              '\t\t\t{'+NL+
              '\t\t\t\tif (i == 0 && cuda::geometry.xsz > 1'+NL+
              '\t\t\t\t\t\t&& cuda::boundaries.BC_type[Boundary::index_w(i, j)] == TRANSMISSIVE9)'+NL+
              '\t\t\t\t\tF[threadIdx.y][threadIdx.x] = F[threadIdx.y][threadIdx.x+1];'+NL+
              '\t\t\t\telse if (i == cuda::geometry.xsz && cuda::geometry.xsz > 1'+NL+
              '\t\t\t\t\t\t&& cuda::boundaries.BC_type[Boundary::index_e(i, j)] == TRANSMISSIVE9)'+NL+
              '\t\t\t\t\tF[threadIdx.y][threadIdx.x] = F[threadIdx.y][threadIdx.x-1];'+NL+
              '\t\t\t}'+NL+NL+
              '\t\t\t__syncthreads();'+NL+NL+
              '\t\t\tif (i <= cuda::geometry.xsz && j <= cuda::geometry.ysz)'+NL+
              '\t\t\t{'+NL+
              '\t\t\t\tF_e = F[threadIdx.y][threadIdx.x];'+NL+
              '\t\t\t\tupdate_mass_stats_x(mass_stats, F_e.H, i, j);'+NL+
              '\t\t\t}'+NL+NL+
              '\t\t\tif (threadIdx.x == 0) continue;'+NL
          x=x.replace(marker,ins,1)
          s=s[:xa]+x+s[xz:]

          ya=s.index('__global__ void'+NL+'__launch_bounds__(CUDA_BLOCK_SIZE)'+NL+'update_flow_variables_y')
          yz=s.index(NL+'}'+NL+'}'+NL+'}'+NL+NL+'lis::cuda::fv1::Solver::Solver',ya)
          y=s[ya:yz]
          old='\t\t\t\tF[threadIdx.y][threadIdx.x] = F_s;'+NL+'\t\t\t\tupdate_mass_stats_y(mass_stats, F_s.H, i, j);'+NL
          if y.count(old)!=1: raise SystemExit('CUDA y: expected one pre-sync mass-stats site')
          y=y.replace(old,'\t\t\t\tF[threadIdx.y][threadIdx.x] = F_s;'+NL,1)
          marker='                        __syncthreads();'+NL+NL+'                        if (threadIdx.y == 0) continue;'+NL
          if y.count(marker)!=1: raise SystemExit('CUDA y: sync marker mismatch')
          ins='                        __syncthreads();'+NL+NL+
              '\t\t\tif (i <= cuda::geometry.xsz && j <= cuda::geometry.ysz)'+NL+
              '\t\t\t{'+NL+
              '\t\t\t\tif (j == 0 && cuda::geometry.ysz > 1'+NL+
              '\t\t\t\t\t\t&& cuda::boundaries.BC_type[Boundary::index_n(i, j)] == TRANSMISSIVE9)'+NL+
              '\t\t\t\t\tF[threadIdx.y][threadIdx.x] = F[threadIdx.y+1][threadIdx.x];'+NL+
              '\t\t\t\telse if (j == cuda::geometry.ysz && cuda::geometry.ysz > 1'+NL+
              '\t\t\t\t\t\t&& cuda::boundaries.BC_type[Boundary::index_s(i, j)] == TRANSMISSIVE9)'+NL+
              '\t\t\t\t\tF[threadIdx.y][threadIdx.x] = F[threadIdx.y-1][threadIdx.x];'+NL+
              '\t\t\t}'+NL+NL+
              '                        __syncthreads();'+NL+NL+
              '\t\t\tif (i <= cuda::geometry.xsz && j <= cuda::geometry.ysz)'+NL+
              '\t\t\t{'+NL+
              '\t\t\t\tF_s = F[threadIdx.y][threadIdx.x];'+NL+
              '\t\t\t\tupdate_mass_stats_y(mass_stats, F_s.H, i, j);'+NL+
              '\t\t\t}'+NL+NL+
              '                        if (threadIdx.y == 0) continue;'+NL
          y=y.replace(marker,ins,1)
          s=s[:ya]+y+s[yz:]
          p.write_bytes(s.encode('utf-8'))
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --stat
          git diff -- lisflood/lisflood.h lisflood/swe/fv1.cpp lisflood/cuda/cuda_boundary.cu lisflood/cuda/fv1/cuda_fv1_solver.cu
          test "$(git diff --name-only | wc -l)" -eq 4
          grep -q 'TRANSMISSIVE9 = 9' lisflood/lisflood.h
          grep -q 'BCptr->BC_Ident\[bc_i\] == TRANSMISSIVE9' lisflood/swe/fv1.cpp
          grep -q 'Boundary::index_w(i, j).*TRANSMISSIVE9\|TRANSMISSIVE9' lisflood/cuda/fv1/cuda_fv1_solver.cu

      - name: Commit native implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lisflood/lisflood.h lisflood/swe/fv1.cpp lisflood/cuda/cuda_boundary.cu lisflood/cuda/fv1/cuda_fv1_solver.cu
          git commit -m 'Add flux-transmissive FV1 boundary condition'
          git push origin transmissive-impl
